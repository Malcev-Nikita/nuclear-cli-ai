# Настройки Nuclear CLI AI (дефолты). Личное — в config.local.toml (тот же
# формат, только нужные ключи; в .gitignore — git pull не конфликтует).
# Env-переменные (OLLAMA_MODEL, ASSISTANT_NAMES, ...) сильнее обоих файлов.

[connections]
# Nuclear: Settings → Integrations → Enable MCP Server (порт занят -> 8801+).
nuclear_mcp_url = "http://127.0.0.1:8800/mcp"
# Ollama — мозг для сложных команд (другой ПК -> его IP).
ollama_url = "http://127.0.0.1:11434"
# qwen3:1.7b — быстрая, изредка тупит; qwen3:4b — умнее, чуть медленнее.
ollama_model = "qwen3:1.7b"
# Сколько держать модель в памяти (иначе холодный старт на первой команде).
ollama_keep_alive = "30m"
# Макс. секунд ждать Nuclear/Ollama (первый поиск YT Music бывает долгим).
http_timeout = 90

[assistant]
# Имена ассистента; ловятся нечётко (±1 буква).
names = ["мага"]
# Лор/характер ассистента — добавляется в системный промпт LLM и влияет на
# болтовню и пересказы. Пусто = обычный помощник.
lore = """
Тебя зовут Мага, тебе 15 лет, ты родом из Махачкалы.
Характер вспыльчивый: отвечаешь дерзко, можешь и грубо, но коротко и по делу.
Часто вставляешь словечко «ба» — в конце фразы или в середине по смыслу.
Пример: «Ну включил я, ба, чего ещё?»
"""
# После «Мага!» без команды столько секунд команда принимается без имени.
followup_sec = 8.0
# Команды без имени; фраза целиком из команды. «*» = любое окончание.
# Расширять осторожно: сработает от ТВ/чужого разговора.
bare_commands = [
    "стоп", "стой", "хватит", "пауза", "подожди",
    "играй", "продолжи", "продолжай",
    "дальше", "следующ*", "пропусти", "скип",
    "назад", "предыдущ*",
    "громче", "погромче", "тише", "потише",
]
# Обрывают речь ассистента (музыку не трогают), работают без имени.
shutup_commands = ["замолчи", "заткнись", "помолчи"]
# Команда первым/последним словом короткой фразы тоже срабатывает;
# это макс. слов во фразе (0 = выключить).
context_command_max_words = 8
# Перебивание озвучки: голос громче эха колонок во столько раз запускает
# проверку («заткнись»/имя -> замолкает; чужой разговор — нет). 0 = выкл.
barge_gain = 2.5

[whisper]
# large-v3-turbo — лучший русский (~1.5 ГБ VRAM); medium — компромисс;
# small — слабые машины (путает имена артистов).
model = "large-v3-turbo"
# "auto" = cuda, не вышло -> cpu. Или жёстко "cuda"/"cpu".
device = "auto"
# Перебор вариантов: 5 — точнее (имена), 1 — быстрее.
beam = 5

[microphone]
# "" = системный по умолчанию; иначе номер/часть имени из --devices.
device = ""
# Частота (whisper обучен на 16000) и размер блока — не менять.
sample_rate = 16000
block = 512
# Сколько звука ДО срабатывания клеить к фразе (не резать «Ма-» из «Мага»).
pre_roll_sec = 0.9
# Тишина, закрывающая фразу: меньше = быстрее ответ, больше = не обрывает.
silence_end_sec = 0.4
# Для длинных фраз (речи уже >= long_phrase_sec) тишина длиннее — пауза
# посреди «включи какой-нибудь… ролик…» не режет команду на куски.
silence_end_long_sec = 0.9
long_phrase_sec = 1.5
# Макс./мин. длина фразы, сек.
max_utter_sec = 12.0
min_utter_sec = 0.4
# Речь = громче шумового пола во столько раз (меньше = чувствительнее).
# Подбор порога вживую: python main.py --meter (в тишине и под музыку).
vad_gain = 2.5
# Тише этого — точно не речь (поднять, если «слышит» шорохи).
vad_abs_min = 0.004
# Отстали сильнее — старый звук выбрасывается (иначе копится лаг и «глохнет»).
max_lag_sec = 3.0

[tts]
# Голос (примеры: rhasspy.github.io/piper-samples; русские: irina, denis,
# dmitri, ruslan). "" = без озвучки. Качается сам в voices/ (~60 МБ).
voice = "ru_RU-irina-medium"
# Темп речи: 1.0 — обычный, больше = быстрее.
speed = 1.5
# До скольких процентов приглушать музыку, пока ассистент говорит (0 = не трогать).
# Заодно тише эхо в микрофоне — надёжнее срабатывает «заткнись» поверх речи.
duck_volume = 25

[notes]
# Папка голосовых заметок («запиши …»); относительный путь — от корня проекта.
dir = "public/notepad"

[reminders]
# Файл таймеров и будильников. Хранятся на диске, чтобы будильник на утро
# не пропал, если вечером закрыть ассистента.
file = "public/reminders.json"

[internet]
# Город для «какая погода» без уточнения ("" = по IP). Город из команды важнее.
weather_city = "Астрахань"

[b24]
# Входящий вебхук Битрикс24 для «сколько я проработал» (права: задачи, профиль).
# СЕКРЕТ — держать в config.local.toml, не в git. "" = навык выключен.
b24_webhook = ""
